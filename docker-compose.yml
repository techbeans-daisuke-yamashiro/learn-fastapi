services:
  app:
    container_name: app
    depends_on:
      - mysql
    build:
      context: .
      dockerfile: ./docker/app/Dockerfile
      args:
        CONTAINER_USER: ${CONTAINER_USER:-appuser}
        CONTAINER_GID: ${CONTAINER_GID:-1000}
        CONTAINER_UID: ${CONTAINER_UID:-1000}
    tty: true
    environment:
      APP_ENV: local
      GCLOUD_PROJECT_ID: ${GCP_PROJECT_ID:-example}
      GOOGLE_APPLICATION_CREDENTIALS: /home/${CONTAINER_USER}/.config/credentials.json
      #ローカルのエミュレータに接続されます。オンライン側を使いたい場合は以下各行コメントアウト
      FIREBASE_AUTH_EMULATOR_HOST: firebase:9099
      FIRESTORE_EMULATOR_HOST: firebase:8090

    volumes:
      - ./src:/app
      - ./data/firebase/credentials.json:/home/${CONTAINER_USER}/.config/credentials.json:ro
      - ./data/app/.cache:/home/${CONTAINER_USER}/.cache
    ports:
      - 8880:8000
  mysql:
    container_name: mysql
    image: mysql:8.0.41
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app_db
      MYSQL_USER: fastapi
      MYSQL_PASSWORD: fastapi
    volumes:
      - ./data/mysql:/var/lib/mysql
  phpmyadmin:
    container_name: phpmyadmin
    image: phpmyadmin/phpmyadmin
    environment:
      - PMA_HOSTS=mysql
      - PMA_USER=root
      - PMA_PASSWORD=root
    ports:
      - 8881:80
  firebase:
    container_name: firebase
    build:
      context: .
      dockerfile: ./docker/firebase/Dockerfile
    tty: true
    environment:
      PROJECT_ID: ${GCP_PROJECT_ID:-example}
    volumes:
      - ./docker/firebase/firebase.json:/opt/firebase/firebase.json
      - ./docker/firebase/storage.rules:/opt/firebase/storage.rules
      - ./docker/firebase/firebase.indexes.json:/opt/firebase/firebase.indexes.json
      - ./docker/firebase/firebaserc:/opt/firebase/.firebaserc
      - ./data/firebase/.config:/home/cloudsdk/.config
      - ./data/firebase/.cache:/home/cloudsdk/.cache
      - ./data/firebase/exports:/opt/firebase/exports
    ports:
      - 9099:9099 # Authentication
      - 8090:8090 # Cloud Firestore
      - 9000:9000 # Realtime Database
      - 8085:8085 # Cloud Pub/Sub
      - 9199:9199 # Cloud Storage
      - 14000:4000 # UI
    command: |
      firebase emulators:start  --import=./exports/data --debug
  cron:
    container_name: cron
    build:
      context: .
      dockerfile: ./docker/cron/Dockerfile
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: crond -l 1 -f